# Strixun Stream Suite — requirements registry (url shortener + icons)
schema_version: 1

requirements:
  FR-SS-ICON-001:
    kind: FR
    title: Shortener semantic action icons
    summary: Shortener copy, delete, refresh, and link actions use Mappy/Lucide semantic icons, not star placeholders or raw text labels alone.
  FR-SS-URL-001:
    kind: FR
    title: Public short URL composition
    summary: composePublicShortUrl works for all five catalog public hosts with the same shortCode.
  FR-SS-URL-002:
    kind: FR
    title: Preferred public host persistence
    summary: ui_shortener_public_host stores catalog hostKey and drives displayed and copied short URLs.
  FR-SS-URL-003:
    kind: FR
    title: Canon public hosts projection
    summary: One shortenerPublicHostsCatalog; SHORTENER_PUBLIC_HOSTS and GET /api/public-hosts match the catalog.
  FR-SS-URL-004:
    kind: FR
    title: Stream Suite shortener graduation
    summary: Stream Suite /url-shortener route has inTesting false and no testing banner copy.
  FR-SS-URL-005:
    kind: FR
    title: lastViewedAt on redirect
    summary: Each redirect sets lastViewedAt on the link aggregate and user list mirror; exposed on list and info APIs.
  FR-SS-URL-006:
    kind: FR
    title: Per-host view analytics without KV rollups
    summary: Redirect records hostKey and viewedAt; per-link viewsByHostKey on aggregates; global rollups via Analytics Engine event sink, not per-host KV keys.
  FR-SS-URL-007:
    kind: FR
    title: Human-friendly URL list search
    summary: Search short code, destination URL, and displayed short URL via matchesSearchQueryFields.
  FR-SS-URL-008:
    kind: FR
    title: URL list sort
    summary: Sort list by created, clicks, last viewed, or short code with direction toggle.
  FR-SS-URL-009:
    kind: FR
    title: Virtualized URL DataTable
    summary: URL list uses shared DataTable with virtualization for large lists.
  FR-SS-URL-010:
    kind: FR
    title: Per-link host view bars
    summary: viewsByHostKey rendered with HorizontalBar series and catalog labels.
  FR-SS-URL-011:
    kind: FR
    title: Top and recent link panels
    summary: Top links by clicks and recently used by lastViewedAt from list state.
  FR-SS-URL-012:
    kind: FR
    title: User analytics summary card
    summary: User-scope summary from GET /api/analytics/summary in workspace UI.
  FR-SS-DEPLOY-001:
    kind: FR
    title: Auto cache bust on Pages deploy
    summary: Each GitHub Pages deploy writes version.json, bumps index asset query params with git sha, and reloads clients when deploy sha changes (PWA-safe).