# Access Service - Cloudflare Worker Configuration
# Handles access control decisions, roles, permissions, and quotas
# Service-agnostic: works for ANY service (mods, customer, analytics, etc.)

name = "strixun-access-service"
main = "dist/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (secrets should be set via wrangler secret put)
# DO NOT put actual secrets here - use wrangler CLI:
#   wrangler secret put JWT_SECRET          # REQUIRED: JWT signing secret (must match OTP auth service)
#   wrangler secret put SERVICE_API_KEY     # REQUIRED: API key for service-to-service authentication
#   wrangler secret put SUPER_ADMIN_API_KEY # REQUIRED: API key for super admin access
#   wrangler secret put ALLOWED_ORIGINS     # OPTIONAL: Comma-separated CORS origins (recommended for production)

# Production environment (default)
[vars]
ENVIRONMENT = "production"
JWT_ISSUER = "https://auth.idling.app"
# Fallback CORS list when no ALLOWED_ORIGINS secret is set. Production currently uses a secret (wrangler secret list);
# secrets override [vars]. If you secret put, MERGE with the existing dashboard value — never replace with this subset alone.
ALLOWED_ORIGINS = "https://idling.app,https://www.idling.app,https://auth.idling.app,https://mods.idling.app,https://mods-api.idling.app,https://customer-api.idling.app,https://access.idling.app,https://access-api.idling.app,https://game.idling.app,https://chat.idling.app,https://api.idling.app,https://s.idling.app,https://short.idling.app,https://shorten.idling.app,https://streamkit.idling.app,https://design.idling.app,https://docs.idling.app,https://music-api.idling.app,https://short.army,https://sss.idling.app,https://flags.idling.app,https://flags-api.idling.app"

# Production KV Namespace for access control data
[[kv_namespaces]]
binding = "ACCESS_KV"
id = "ee3fee37d3d74ffdb7ebeeae4b0d86ff"

[[kv_namespaces]]
binding = "OTP_AUTH_KV"
id = "680c9dbe86854c369dd23e278abb41f9"

[[d1_databases]]
binding = "FLAGS_DB"
database_name = "idling-feature-flags"
database_id = "6308b314-36c4-45c5-8f3c-d3f826bc7a6c"
migrations_dir = "../feature-flag-service/migrations"

# Service binding to auth Worker so JWKS fetch uses internal routing (avoids same-zone 522).
# If you deploy otp-auth-service with --env production, set service = "otp-auth-service-production".
[[services]]
binding = "AUTH_SERVICE"
service = "otp-auth-service"

# Production routes - API backend at access-api.idling.app
# Frontend UI will be at access.idling.app (Cloudflare Pages)
[[routes]]
pattern = "access-api.idling.app/*"
zone_name = "idling.app"

# Development environment (uses shared KV namespaces for local testing)
[env.development]

[env.development.vars]
ENVIRONMENT = "development"
JWT_ISSUER = "http://localhost:8787"
ACCESS_SERVICE_URL = "http://localhost:8795"
JWT_SECRET = "dev-jwt-secret-do-not-use-in-production-abc123"
SERVICE_API_KEY = "dev-service-api-key-for-local-testing"
SUPER_ADMIN_API_KEY = "dev-super-admin-api-key-for-local-testing"
NETWORK_INTEGRITY_KEYPHRASE = "test-integrity-keyphrase-for-local-development"
CUSTOMER_API_URL = "http://localhost:8790"
ALLOWED_ORIGINS = "http://localhost:3001,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5178,http://localhost:5180,http://localhost:8787,http://localhost:8797,http://localhost:5179,http://localhost:3000,https://flags.idling.app,https://flags-api.idling.app"

# Development KV Namespace (shares production namespace for local testing)
[[env.development.kv_namespaces]]
binding = "ACCESS_KV"
id = "ee3fee37d3d74ffdb7ebeeae4b0d86ff"

[[env.development.kv_namespaces]]
binding = "OTP_AUTH_KV"
id = "680c9dbe86854c369dd23e278abb41f9"

[[env.development.d1_databases]]
binding = "FLAGS_DB"
database_name = "idling-feature-flags"
database_id = "6308b314-36c4-45c5-8f3c-d3f826bc7a6c"
migrations_dir = "../feature-flag-service/migrations"

# Observability Configuration
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
